name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install (lockfile-exact)
        id: install
        run: npm ci
        continue-on-error: true
      - name: Report install failure
        if: steps.install.outcome == 'failure'
        run: |
          echo "node $(node -v) npm $(npm -v)"
          npm ci --loglevel verbose > npm-ci.log 2>&1 || true
          grep -E "npm error|ERR!" npm-ci.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests (unit + database policy tests)
        run: npm test
      - name: Production build
        # Built WITHOUT Supabase variables on purpose: the public site must build and degrade
        # gracefully when no backend is configured.
        run: npm run build
